name: stage-2 offline checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pytest
      - name: dataset integrity
        run: cd dataset && sha256sum -c MANIFEST.sha256 --quiet
      - name: scorer imports without the Brain runtime
        working-directory: code/scripts
        run: python -c "import banc_realite.holders, banc_realite.dossiers, banc_realite.normalize; print('ok')"
