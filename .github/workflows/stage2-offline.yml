name: stage-2 offline checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - name: dataset integrity
        run: cd dataset && sha256sum -c MANIFEST.sha256 --quiet
      - name: model-free scorer tests (no Brain runtime, no model call)
        working-directory: code
        run: python -m pytest -q tests/banc_realite/test_holders.py tests/banc_realite/test_classer_couple.py tests/banc_realite/test_matching.py tests/banc_realite/test_accord.py tests/banc_realite/test_dossiers.py
